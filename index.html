<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Written in the stars</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        /* Scoped to this splash page only — kept out of css/style.css
           so it can't affect any other page. */
        body.headphones-page {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: "JetBrains Mono", "Courier New", monospace;
            cursor: crosshair;
        }

        .headphones-link {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fffbfb;
            text-align: center;
            padding: 0 24px;
        }

        .headphones-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .headphones-icon {
            width: 46px;
            height: 46px;
            opacity: .85;
        }

        .headphones-message {
            margin: 0;
            padding: 18px 0;
            width: max-content;
            max-width: 100%;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: .18em;
            line-height: 1.7;
            white-space: pre-line;
            text-transform: uppercase;
        }

        .headphones-ok {
            margin: 0;
            padding: 10px 26px;
            border: 1px solid rgba(255, 255, 255, .55);
            background: transparent;
            color: #fffbfb;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .25em;
            cursor: pointer;
            transition: opacity .2s ease, background-color .2s ease;
            opacity: .8;
        }

        .headphones-ok:hover,
        .headphones-ok:focus-visible {
            opacity: 1;
            background: rgba(255, 255, 255, .08);
        }
    </style>
</head>

<body class="headphones-page">

    <canvas id="bgCanvas" class="bg-canvas"></canvas>

    <div class="headphones-link">

        <div class="headphones-content">

            <p class="headphones-message">
                <span id="headphonesMessageText"></span><span class="type-cursor"></span>
            </p>

            <button type="button" class="headphones-ok" id="headphonesOk">OK</button>

        </div>

    </div>

    <script src="js/starfield.js"></script>
    <script src="js/button-sound.js"></script>
    <script>
        initStarfield("bgCanvas");

        const headphonesMessage = document.getElementById("headphonesMessageText");
        const messageLines = ["USE HEADPHONES", "FOR THE BEST EXPERIENCE"];
        const messageText = messageLines.join("\n");

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            headphonesMessage.textContent = messageText;
        } else {
            let characterIndex = 0;
            let stopTypingSound = null;

            const typeNextCharacter = () => {
                if (characterIndex === 0 || messageText[characterIndex - 1] === "\n") {
                    stopTypingSound = window.startTypingSound
                        ? window.startTypingSound()
                        : null;
                }

                headphonesMessage.textContent = messageText.slice(0, characterIndex);
                characterIndex += 1;

                if (characterIndex <= messageText.length) {
                    if (messageText[characterIndex - 1] === "\n" && stopTypingSound) {
                        stopTypingSound();
                        stopTypingSound = null;
                    }
                    setTimeout(typeNextCharacter, messageText[characterIndex - 1] === "\n" ? 260 : 65);
                } else if (stopTypingSound) {
                    stopTypingSound();
                    stopTypingSound = null;
                }
            };

            typeNextCharacter();
        }

        // A click here counts as the visitor's first interaction,
        // which is what lets landing.html's sound autoplay right
        // away instead of needing a second click there.
        document.getElementById("headphonesOk").addEventListener("click", function () {
            window.location.href = "landing.html";
        });
    </script>

</body>
</html>
